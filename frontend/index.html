
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Saathi | Integral University</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #1f2937;
    }

    header {
      background: #253b80;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    main {
      max-width: 780px;
      margin: 28px auto;
      padding: 0 15px;
    }

    .chatbox {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000010;
    }

    #messages {
      min-height: 280px;
      max-height: 440px;
      overflow-y: auto;
      padding: 8px 0;
    }

    .message {
      padding: 12px 15px;
      margin: 12px 0;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }

    .bot {
      background: #edf1ff;
      margin-right: 20px;
    }

    .user {
      background: #d9fbe8;
      margin-left: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccd2df;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background: #253b80;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 12px;
      color: #596579;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #687386;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎓 Campus Saathi</h1>
    <p>Your AI Guide to Integral University</p>
  </header>

  <main>
    <section class="chatbox">
      <h2>Ask Campus Saathi</h2>
      <p>Ask about university information available in our documents.</p>

      <div id="messages" aria-live="polite">
        <div class="message bot">
          Hello! 👋 I am Campus Saathi. How can I help you today?
        </div>
      </div>

      <form id="chatForm">
        <input
          id="question"
          type="text"
          placeholder="Ask about fees, exams, admissions..."
          aria-label="Your question"
          required
        >
        <button id="sendButton" type="submit">Send</button>
      </form>

      <div id="status">Checking backend connection...</div>
    </section>
  </main>

  <footer>
    Campus Saathi · AI-powered student assistance
  </footer>

  <script>
    const API_URL = "http://127.0.0.1:8000";

    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function checkConnection() {
      try {
        const response = await fetch(API_URL + "/");

        if (!response.ok) {
          throw new Error("Backend is unavailable");
        }

        status.textContent = "🟢 Backend connected";
      } catch (error) {
        status.textContent =
          "🔴 Backend not connected. Start the Python server in VS Code.";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const question = input.value.trim();

      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      const loading = addMessage("Thinking... Please wait.", "bot");
      status.textContent = "Campus Saathi is preparing your answer...";

      try {
        const response = await fetch(API_URL + "/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Request failed");
        }

        loading.textContent = data.answer || "No answer received.";
        status.textContent = "🟢 Answer received";

      } catch (error) {
        loading.textContent =
          "Sorry, the request failed. Please check the backend terminal and try again.";

        status.textContent = "🔴 Error: " + error.message;
        console.error("Campus Saathi error:", error);

      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    });

    checkConnection();
  </script>
</body>
</html>
